<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://p.trellocdn.com; object-src 'none'; base-uri 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time tracking preview</title>
  <link rel="icon" href="img/icon.svg">
  <link rel="stylesheet" href="css/app.css">
  <script defer src="js/duration.js"></script>
  <script defer src="js/model.js"></script>
  <script defer src="js/epic.js"></script>
  <script defer src="js/aggregate.js"></script>
  <script defer src="js/excel.js"></script>
  <script defer src="js/badges.js"></script>
  <script defer src="js/dom.js"></script>
  <script defer src="js/timeline.js"></script>
  <script defer src="js/planning-view.js"></script>
  <script defer src="js/card-view.js"></script>
  <script defer src="js/report-view.js"></script>
  <script defer src="js/timeline-view.js"></script>
  <script defer src="js/preview.js"></script>
</head>
<body class="page trello-power-up">
  <div class="preview-wrap">
    <h1>Preview without Trello</h1>
    <p class="lead">Same card, report and timeline UI as on the board. Data lives only in this browser tab.</p>
    <p id="selftest-result" class="hint"></p>
    <div class="preview-grid">
      <section>
        <label class="field">Card
          <select id="card-picker"></select>
        </label>
        <div id="card-app" class="panel"></div>
      </section>
      <section>
        <div id="report-app" class="panel"></div>
      </section>
    </div>
    <section class="panel preview-timeline"><div id="timeline-app"></div></section>
  </div>
</body>
</html>
