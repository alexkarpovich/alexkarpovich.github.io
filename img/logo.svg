<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Project time tracker</title>
  <desc id="desc">Blue app icon with a clock, task ticket, and time report chart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38A5FF"/>
      <stop offset="1" stop-color="#1747E8"/>
    </linearGradient>
    <linearGradient id="ticket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD43B"/>
      <stop offset="1" stop-color="#FF970D"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#082A78" flood-opacity=".24"/>
    </filter>
  </defs>

  <!-- Rounded app tile -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bg)"/>

  <!-- Clock -->
  <g filter="url(#shadow)">
    <circle cx="220" cy="204" r="132" fill="#173B83"/>
    <circle cx="220" cy="204" r="116" fill="url(#paper)" stroke="#D7E5FF" stroke-width="3"/>
    <g stroke="#1D478F" stroke-width="8" stroke-linecap="round">
      <path d="M220 111v13"/>
      <path d="M220 284v13"/>
      <path d="M127 204h13"/>
      <path d="M300 204h13"/>
      <path d="M154 138l9 9"/>
      <path d="M277 261l9 9"/>
      <path d="M286 138l-9 9"/>
      <path d="M163 261l-9 9"/>
    </g>
    <path d="M220 204L171 163" fill="none" stroke="#173B83" stroke-width="14" stroke-linecap="round"/>
    <path d="M220 204L278 172" fill="none" stroke="#173B83" stroke-width="12" stroke-linecap="round"/>
    <circle cx="220" cy="204" r="13" fill="#17458F"/>
  </g>

  <!-- Task ticket -->
  <g transform="rotate(-12 157 321)" filter="url(#shadow)">
    <path d="M61 281a20 20 0 0 1 20-20h139a20 20 0 0 1 20 20v13a18 18 0 0 0 0 36v13a20 20 0 0 1-20 20H81a20 20 0 0 1-20-20v-13a18 18 0 0 0 0-36z" fill="url(#ticket)"/>
    <path d="M99 294h104" stroke="#C96B08" stroke-width="13" stroke-linecap="round"/>
    <path d="M99 326h67" stroke="#C96B08" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- Report card -->
  <g filter="url(#shadow)">
    <rect x="267" y="177" width="207" height="292" rx="25" fill="url(#paper)"/>
    <!-- chart bars -->
    <rect x="292" y="254" width="29" height="32" rx="5" fill="#2682F8"/>
    <rect x="331" y="235" width="29" height="51" rx="5" fill="#39BE8A"/>
    <rect x="370" y="218" width="29" height="68" rx="5" fill="#31B5F5"/>
    <rect x="409" y="198" width="29" height="88" rx="5" fill="#7654F6"/>
    <path d="M284 296h171" stroke="#C8D9F5" stroke-width="5" stroke-linecap="round"/>
    <!-- report rows -->
    <circle cx="293" cy="326" r="10" fill="#2682F8"/>
    <path d="M313 326h42" stroke="#BFD3F4" stroke-width="8" stroke-linecap="round"/>
    <text x="369" y="331" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#173B83">2h 30m</text>
    <circle cx="293" cy="366" r="10" fill="#39BE8A"/>
    <path d="M313 366h42" stroke="#BFD3F4" stroke-width="8" stroke-linecap="round"/>
    <text x="369" y="371" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#173B83">4h 15m</text>
    <circle cx="293" cy="406" r="10" fill="#7654F6"/>
    <path d="M313 406h42" stroke="#BFD3F4" stroke-width="8" stroke-linecap="round"/>
    <text x="369" y="411" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#173B83">1h 20m</text>
  </g>
</svg>
